spring:
  application:
    name: chronos

  datasource:
    # 5433 matches the host port published by docker-compose.yml (see the note there).
    url: ${CHRONOS_DB_URL:jdbc:postgresql://localhost:5433/chronos}
    username: ${CHRONOS_DB_USER:chronos}
    password: ${CHRONOS_DB_PASSWORD:chronos}
    hikari:
      # The poller claims a batch on one connection while dispatch threads write results on
      # others, so the pool must comfortably exceed the dispatch pool size (tuned in M4).
      maximum-pool-size: 20
      pool-name: chronos-pool

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only validates that entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  threads:
    virtual:
      enabled: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

logging:
  level:
    com.chronos: DEBUG

chronos:
  jwt:
    # HS256 needs >= 256 bits of key material. The dev default below is deliberately long and
    # obviously fake; production MUST set CHRONOS_JWT_SECRET (JwtProperties refuses to start
    # with the dev default unless the `dev` profile is active).
    secret: ${CHRONOS_JWT_SECRET:dev-only-insecure-secret-change-me-0123456789abcdef}
    issuer: chronos
    # 1 hour. Tradeoff: no refresh token in M2, so a user re-logs in hourly; that keeps the
    # threat model small (no server-side token store, nothing to revoke) at the cost of UX.
    expiry: 1h

  security:
    # Optional first-admin bootstrap: on startup, if this email is set and no such user exists,
    # an ADMIN is created. Leave the email blank to disable. Without it there is no way to get
    # a first ADMIN, since /auth/register always creates a USER.
    bootstrap-admin:
      email: ${CHRONOS_ADMIN_EMAIL:}
      password: ${CHRONOS_ADMIN_PASSWORD:}

  # Defaults applied to new jobs when the caller does not specify them.
  defaults:
    timezone: UTC
    max-attempts: 3
    initial-backoff-sec: 10
    backoff-multiplier: 2.0
    timeout-sec: 30

  jobs:
    # SSRF guard. Ships DISABLED because the obvious way to try Chronos out — and the way M7's
    # compose demo works — is to point a job at a service on localhost or another container.
    # Turn this on for any deployment where users are not all trusted.
    block-private-targets: ${CHRONOS_BLOCK_PRIVATE_TARGETS:false}
    max-headers: 20
    max-payload-bytes: 65536
  retry:
    # Backoff is capped so a long-broken endpoint retries hourly instead of drifting to days.
    max-backoff-sec: 3600
    jitter-ratio: 0.20
