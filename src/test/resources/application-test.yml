spring:
  jpa:
    hibernate:
      # Same as production: Flyway builds the schema, Hibernate only validates the mapping.
      # This is what makes the integration tests catch entity/schema drift.
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true

chronos:
  scheduler:
    # The @Scheduled timers are off in tests. Integration tests call the enqueuer and poller
    # directly so each step is observable, instead of racing a 5-second background tick.
    enabled: false

logging:
  level:
    org.testcontainers: WARN
    com.github.dockerjava: WARN
